# Real-valued reference: the best pretrained unimodal models from the U-FFIA benchmark
# (PANNs CNN10 + S3D) with a plain late concat fusion (n_divs: 1). It is trained through this
# exact pipeline and split, so the gain from hypercomplex layers and HCF fusion can be measured
# like-for-like. The published U-FFIA AV numbers (cross-attention 0.917, U-FFIA+KD 0.907) come
# from their ViT-based fusion models, which are not re-implemented here.
_base_: teacher_panns_s3d.yaml
name: uffia_like_late_concat_real
model:
  n_divs: 1
  fusion: concat
  fusion_stages: [3]
  num_bottleneck: 4
